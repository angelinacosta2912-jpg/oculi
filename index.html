 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCULI — Acesso restrito</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #050505;
      color: #c8c8c8;
      font-family: "Courier New", monospace;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      border: 1px solid #491313;
      background: #0b0b0b;
      box-shadow: 0 0 25px rgba(120, 0, 0, 0.15);
      text-align: center;
    }

    .aviso {
      color: #8f1717;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    h1 {
      color: #a51c1c;
      font-size: 28px;
      letter-spacing: 5px;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    .arquivo {
      margin: 25px 0;
      padding: 18px;
      border: 1px solid #292929;
      background: #080808;
    }

    .arquivo small {
      display: block;
      color: #666;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .arquivo strong {
      color: #b51e1e;
      font-size: 21px;
      letter-spacing: 3px;
    }

    p {
      font-size: 12px;
      line-height: 1.8;
      color: #888;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #050505;
      border: 1px solid #393939;
      color: #ddd;
      font-family: inherit;
      font-size: 15px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #8f1717;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #641111;
      border: 1px solid #8f1717;
      color: #eee;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    button:hover {
      background: #821818;
    }

    #mensagem {
      min-height: 22px;
      margin-top: 18px;
      color: #b51e1e;
      font-size: 12px;
    }

    .rodape {
      margin-top: 30px;
      color: #383838;
      font-size: 10px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="aviso">⚠ ACESSO RESTRITO ⚠</div>

    <h1>OCULI</h1>

    <div class="subtitulo">
      SISTEMA DE REGISTROS INTERNOS
    </div>

    <p>
      Este terminal contém informações confidenciais.
      O acesso não autorizado está sujeito a registro.
    </p>

    <div class="arquivo">
      <small>DOCUMENTO CLASSIFICADO</small>
      <strong>ORDEM VETO</strong>
    </div>

    <p>
      Insira a credencial de acesso para prosseguir.
    </p>

    <form id="formulario">
      <input
        type="password"
        id="senha"
        placeholder="INSIRA A CREDENCIAL"
        autocomplete="off"
        required
      >

      <button type="submit">AUTENTICAR</button>
    </form>

    <div id="mensagem"></div>

    <div class="rodape">
      OCULI // DOCUMENTO INTERNO // NÃO DISTRIBUIR
    </div>

  </main>

  <script>
    const SENHA = "OGUARDIAO";
    const PAGINA_SECRETA =
      "https://siteinsano.github.io/oculi/pagina.html";

    document
      .getElementById("formulario")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const senhaDigitada =
          document.getElementById("senha").value.trim();

        const mensagem =
          document.getElementById("mensagem");

        if (senhaDigitada === SENHA) {
          mensagem.style.color = "#777";
          mensagem.textContent = "CREDENCIAL ACEITA. REDIRECIONANDO...";

          setTimeout(function() {
            window.location.href = PAGINA_SECRETA;
          }, 700);
        } else {
          mensagem.style.color = "#b51e1e";
          mensagem.textContent = "ACESSO NEGADO. CREDENCIAL INVÁLIDA.";
        }
      });
  </script>
</body>
</html>
